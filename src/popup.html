<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple Image Downloader</title>
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-main">
        <div>
          <h1>Images</h1>
          <p id="status" class="status">Scanning current tab...</p>
        </div>
        <label class="size-filter" for="maxSizeSlider">
          <span id="maxSizeLabel">Min size: 5 KB</span>
          <input id="maxSizeSlider" type="range" min="0" max="512" step="1" value="5">
        </label>
      </div>
      <div class="toolbar-actions">
        <button id="downloadSelectedButton" class="primary" type="button" disabled>Download selected</button>
        <button id="refreshButton" type="button">Refresh</button>
      </div>
    </header>
    <main id="imageList" class="image-list" aria-live="polite"></main>
    <footer class="list-footer">
      <button id="showMoreButton" type="button" hidden>Show more</button>
    </footer>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
